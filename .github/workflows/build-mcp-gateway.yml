name: Build and Push Jira MCP Gateway to Snowflake

on:
  push:
    branches:
      - main
    paths:
      - 'mcp_jira_gateway/**'   # only triggers when these files change
  workflow_dispatch:             # allows manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest       # GitHub provides this — no local machine needed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Snowflake Image Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SNOWFLAKE_REGISTRY }}
          username: ${{ secrets.SNOWFLAKE_USERNAME }}
          password: ${{ secrets.SNOWFLAKE_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp_jira_gateway
          file: ./mcp_jira_gateway/Dockerfile
          platforms: linux/amd64        # required for Snowflake SPCS
          push: true
          tags: ${{ secrets.SNOWFLAKE_REGISTRY }}/zoom_ai_poc/cortex_agent/mcp_images/mcp-jira-gateway:latest